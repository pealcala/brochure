<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Storytelling Compass - Pedro D. Alcalá R.</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>

<body class="bg-slate-50 font-sans text-slate-900 selection:bg-blue-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const DataStorytellingApp = () => {
            const [gameState, setGameState] = useState('welcome'); // welcome, learn, quiz, result
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [currentLearnStep, setCurrentLearnStep] = useState(0);
            const [score, setScore] = useState(0);
            const [answers, setAnswers] = useState([]);

            // --- CONTENIDO EDUCATIVO ---
            const learnSteps = [
                {
                    title: "1. El ADN del Narrador",
                    icon: "fa-fire",
                    color: "text-orange-500",
                    content: (
                        <div className="space-y-4 text-slate-700">
                            <p className="text-lg font-medium">
                                "La gente olvidará lo que dijiste, la gente olvidará lo que hiciste, pero la gente nunca olvidará cómo la hiciste sentir." — Maya Angelou
                            </p>
                            <p>
                                Durante más de 30.000 años, nos sentamos alrededor del fuego a contarnos historias. No es ocio; es <strong>supervivencia</strong>. 
                                La narrativa es la forma en que el cerebro humano codifica la realidad, transmite peligros y comparte sabiduría.
                            </p>
                            <div className="bg-orange-50 p-4 rounded-xl border border-orange-100 mt-4">
                                <div className="flex items-start gap-3">
                                    <i className="fa-solid fa-brain text-orange-600 mt-1"></i>
                                    <div>
                                        <h4 className="font-bold text-orange-800 text-sm">El "Efecto Bruner"</h4>
                                        <p className="text-xs text-slate-600 mt-1">
                                            El psicólogo cognitivo <strong>Jerome Bruner</strong> estimó que los hechos son <strong>22 veces más memorables</strong> si se envuelven en una historia.
                                            Sin narrativa, tus datos entran por un oído y salen por el otro.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ),
                    links: [
                        { label: "Jerome Bruner (Psicología Cognitiva)", url: "https://es.wikipedia.org/wiki/Jerome_Bruner" },
                        { label: "Yuval Noah Harari (Sapiens)", url: "https://es.wikipedia.org/wiki/Sapiens:_De_animales_a_dioses" }
                    ]
                },
                {
                    title: "2. La Batalla por la Atención",
                    icon: "fa-tower-broadcast",
                    color: "text-cyan-500",
                    content: (
                        <div className="space-y-4 text-slate-700">
                            <p>
                                Vivimos en la era de la <strong>Infoxicación</strong>. Un directivo promedio recibe miles de impactos de datos al día.
                                En este ruido digital, el dato crudo es invisible.
                            </p>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 py-2">
                                <div className="bg-slate-100 p-4 rounded-lg text-center opacity-70">
                                    <h4 className="font-bold text-slate-500 text-sm">Abundancia de Información</h4>
                                    <p className="text-xs text-slate-400">Genera pobreza de atención.</p>
                                </div>
                                <div className="bg-cyan-50 p-4 rounded-lg text-center border border-cyan-200">
                                    <h4 className="font-bold text-cyan-800 text-sm">Señal (Storytelling)</h4>
                                    <p className="text-xs text-cyan-600">La única forma de capturar esa atención.</p>
                                </div>
                            </div>
                            <p className="text-sm italic border-l-4 border-slate-300 pl-4 py-1">
                                "La riqueza de información crea una pobreza de atención." — <strong>Herbert Simon</strong> (Premio Nobel).
                                Tu trabajo no es solo mostrar datos, es <strong>ahorrarle esfuerzo cognitivo</strong> a tu audiencia.
                            </p>
                        </div>
                    ),
                    links: [
                        { label: "Economía de la atención", url: "https://es.wikipedia.org/wiki/Econom%C3%ADa_de_la_atenci%C3%B3n" },
                        { label: "Herbert Simon", url: "https://es.wikipedia.org/wiki/Herbert_Alexander_Simon" }
                    ]
                },
                {
                    title: "3. La Tríada del Data Storytelling",
                    icon: "fa-shapes",
                    color: "text-purple-500",
                    content: (
                        <div className="space-y-4 text-slate-700">
                            <p className="text-lg">
                                Ahora que entendemos el "por qué", pasemos al "qué". Según autores como <strong>Brent Dykes</strong>, el Data Storytelling es la intersección estratégica de tres campos.
                            </p>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 py-4">
                                <div className="bg-blue-50 p-4 rounded-xl border border-blue-100">
                                    <div className="flex items-center gap-2 mb-2">
                                        <i className="fa-solid fa-chart-bar text-blue-600 text-xl"></i>
                                        <span className="font-bold text-blue-800">Data Science</span>
                                    </div>
                                    <p className="text-xs text-slate-600">
                                        Provee la evidencia. Sin ella, solo tenemos opiniones. Es el "QUÉ".
                                    </p>
                                </div>
                                <div className="bg-pink-50 p-4 rounded-xl border border-pink-100">
                                    <div className="flex items-center gap-2 mb-2">
                                        <i className="fa-solid fa-layer-group text-pink-600 text-xl"></i>
                                        <span className="font-bold text-pink-800">Visualización</span>
                                    </div>
                                    <p className="text-xs text-slate-600">
                                        Revela patrones invisibles al ojo humano. Es el "CÓMO" lo vemos.
                                    </p>
                                </div>
                                <div className="bg-amber-50 p-4 rounded-xl border border-amber-100">
                                    <div className="flex items-center gap-2 mb-2">
                                        <i className="fa-solid fa-book-open text-amber-600 text-xl"></i>
                                        <span className="font-bold text-amber-800">Narrativa</span>
                                    </div>
                                    <p className="text-xs text-slate-600">
                                        Engancha la emoción y da contexto. Es el "POR QUÉ" importa.
                                    </p>
                                </div>
                            </div>
                        </div>
                    ),
                    links: [
                        { label: "Concepto: Visualización de Datos", url: "https://es.wikipedia.org/wiki/Visualizaci%C3%B3n_de_datos" },
                        { label: "Ref: Brent Dykes", url: "https://www.forbes.com/sites/brentdykes/" }
                    ]
                },
                {
                    title: "4. Psicología Visual: Gestalt",
                    icon: "fa-eye",
                    color: "text-teal-500",
                    content: (
                        <div className="space-y-4 text-slate-700">
                            <p>
                                Antes de leer, el cerebro procesa. Las <strong>Leyes de la Gestalt</strong> explican cómo percibimos patrones visuales. Un buen dashboard usa estas leyes para agrupar información lógicamente sin necesidad de bordes o cajas.
                            </p>
                            <ul className="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                <li className="flex gap-3">
                                    <div className="bg-white p-1 rounded border shadow-sm h-fit text-teal-600"><i className="fa-solid fa-layer-group"></i></div>
                                    <div>
                                        <span className="font-bold block text-sm">Ley de Proximidad</span>
                                        <span className="text-xs text-slate-500">Objetos cercanos se perciben como un grupo. (Ej: KPIs de ventas juntos).</span>
                                    </div>
                                </li>
                                <li className="flex gap-3">
                                    <div className="bg-white p-1 rounded border shadow-sm h-fit text-teal-600"><i className="fa-solid fa-bullseye"></i></div>
                                    <div>
                                        <span className="font-bold block text-sm">Ley de Semejanza</span>
                                        <span className="text-xs text-slate-500">Elementos con mismo color/forma se ven relacionados. (Ej: Todo lo 'malo' en rojo).</span>
                                    </div>
                                </li>
                                <li className="flex gap-3">
                                    <div className="bg-white p-1 rounded border shadow-sm h-fit text-teal-600"><i className="fa-solid fa-border-none"></i></div>
                                    <div>
                                        <span className="font-bold block text-sm">Ley de Cierre</span>
                                        <span className="text-xs text-slate-500">El cerebro completa figuras incompletas. No necesitas encerrar todo en cajas.</span>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    ),
                    links: [
                        { label: "Psicología de la Gestalt", url: "https://es.wikipedia.org/wiki/Psicolog%C3%ADa_de_la_Gestalt" }
                    ]
                },
                {
                    title: "5. El Arco Dramático (Freytag)",
                    icon: "fa-arrow-trend-up",
                    color: "text-green-500",
                    content: (
                        <div className="space-y-4 text-slate-700">
                            <p>
                                Adaptando la <strong>Pirámide de Freytag</strong> (usada en teatro y novelas) a los negocios, evitamos el aburrimiento de los reportes planos.
                            </p>
                            <div className="relative h-32 w-full mt-6 mb-2 border-b-2 border-slate-300">
                                {/* SVG simple del arco */}
                                <svg viewBox="0 0 100 40" className="absolute bottom-0 w-full h-full drop-shadow-md">
                                    <path d="M0,40 L30,40 L50,5 L70,30 L100,30" fill="none" stroke="#2563eb" strokeWidth="1" strokeDasharray="2,2" />
                                    <circle cx="15" cy="40" r="1.5" className="fill-slate-500" />
                                    <circle cx="50" cy="5" r="2" className="fill-red-500 animate-pulse" />
                                    <circle cx="85" cy="30" r="1.5" className="fill-green-600" />
                                    <text x="15" y="38" fontSize="3" textAnchor="middle" className="font-bold fill-slate-600">Contexto</text>
                                    <text x="50" y="2" fontSize="3" textAnchor="middle" className="font-bold fill-red-600">CLÍMAX (Insight)</text>
                                    <text x="85" y="28" fontSize="3" textAnchor="middle" className="font-bold fill-green-700">Acción</text>
                                </svg>
                            </div>
                            <p className="text-sm italic text-center text-slate-500">
                                El "Clímax" en datos no es una explosión, es el descubrimiento de un problema u oportunidad irreversible.
                            </p>
                        </div>
                    ),
                    links: [
                        { label: "Estructura Dramática", url: "https://es.wikipedia.org/wiki/Estructura_dram%C3%A1tica" }
                    ]
                },
                {
                    title: "6. Carga Cognitiva y Data-Ink",
                    icon: "fa-bolt",
                    color: "text-yellow-500",
                    content: (
                        <div className="space-y-4 text-slate-700">
                            <p>
                                El cerebro humano tiene un ancho de banda limitado. La <strong>Teoría de la Carga Cognitiva</strong> (Sweller) sugiere que debemos reducir el esfuerzo innecesario.
                            </p>
                            <div className="bg-slate-900 text-white p-4 rounded-xl shadow-inner">
                                <h4 className="font-mono text-yellow-400 text-sm mb-2">Formula: Data-Ink Ratio (Edward Tufte)</h4>
                                <div className="flex items-center gap-2 text-sm font-mono">
                                    <span>Valor = </span>
                                    <div className="flex flex-col items-center border-b border-white px-2">
                                        <span>Tinta usada para DATOS</span>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2 text-sm font-mono ml-[3.5rem]">
                                    <div className="flex flex-col items-center px-2">
                                        <span>Tinta TOTAL en gráfico</span>
                                    </div>
                                </div>
                                <p className="mt-3 text-xs text-slate-300">
                                    Objetivo: Acercarse a 1.0. Elimina fondos, rejillas 3D y decoraciones redundantes.
                                </p>
                            </div>
                        </div>
                    ),
                    links: [
                        { label: "Carga Cognitiva", url: "https://es.wikipedia.org/wiki/Carga_cognitiva" },
                        { label: "Edward Tufte", url: "https://www.edwardtufte.com/" }
                    ]
                },
                {
                    title: "7. La Reacción Esperada",
                    icon: "fa-heart",
                    color: "text-red-500",
                    content: (
                        <div className="text-center space-y-6">
                            <p className="text-slate-700">
                                El éxito de un proyecto de BI no se mide en terabytes procesados, sino en <strong>decisiones tomadas</strong>.
                            </p>
                            
                            <div className="flex justify-between items-center px-4 md:px-12 mb-2">
                                <div className="flex flex-col items-center opacity-40 grayscale">
                                    <span className="text-3xl mb-1">🤔</span>
                                    <span className="text-xs font-bold">Confusión</span>
                                </div>
                                <div className="h-0.5 flex-grow bg-slate-200 mx-2"></div>
                                <div className="flex flex-col items-center opacity-60 grayscale">
                                    <span className="text-3xl mb-1">🙂</span>
                                    <span className="text-xs font-bold">Aprobación</span>
                                </div>
                                <div className="h-0.5 flex-grow bg-green-200 mx-2"></div>
                                <div className="flex flex-col items-center transform scale-110">
                                    <span className="text-4xl mb-1 drop-shadow-md">🚀</span>
                                    <span className="text-xs font-bold text-green-600">ACCIÓN</span>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4 text-left">
                                <div className="bg-red-50 p-3 rounded-lg border border-red-100 relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-1 opacity-10"><i className="fa-solid fa-bullseye text-red-900"></i></div>
                                <span className="text-xs font-bold text-red-800 uppercase block mb-1">Mala señal</span>
                                <p className="text-sm text-red-700 italic">"¿Puedes exportarlo a Excel para que yo lo revise?"</p>
                                <p className="text-[10px] text-red-500 mt-1">(Tu visualización no respondió su duda).</p>
                                </div>
                                <div className="bg-green-50 p-3 rounded-lg border border-green-100 relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-1 opacity-10"><i className="fa-solid fa-bolt text-green-900"></i></div>
                                <span className="text-xs font-bold text-green-800 uppercase block mb-1">Buena señal</span>
                                <p className="text-sm text-green-700 italic">"Debemos llamar al proveedor ahora mismo."</p>
                                <p className="text-[10px] text-green-500 mt-1">(Has generado una acción inmediata).</p>
                                </div>
                            </div>
                        </div>
                    ),
                    links: [
                        { label: "Inteligencia empresarial (BI)", url: "https://es.wikipedia.org/wiki/Inteligencia_empresarial" }
                    ]
                },
                {
                    title: "8. El Panorama Completo",
                    icon: "fa-layer-group",
                    color: "text-indigo-500",
                    content: (
                        <div className="space-y-4">
                        <p className="text-slate-700 text-center mb-6">
                            Así luce el flujo de trabajo completo. Todo comienza antes de tocar un solo dato.<br/>
                        </p>
                        
                        <div className="relative flex flex-col gap-0 max-w-sm mx-auto">
                            {/* Paso 1 - NUEVO */}
                            <div className="flex gap-4 items-center group">
                            <div className="flex-shrink-0 w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center border-2 border-slate-200 group-hover:border-red-400 group-hover:bg-red-50 transition-colors z-10">
                                <i className="fa-solid fa-circle-question w-6 h-6 flex justify-center items-center text-slate-500 group-hover:text-red-600 text-xl"></i>
                            </div>
                            <div className="bg-white p-3 rounded-lg border border-slate-100 shadow-sm flex-grow group-hover:shadow-md transition-shadow">
                                <h4 className="font-bold text-slate-800 text-sm">1. Definición del Problema</h4>
                                <p className="text-xs text-slate-500">¿Qué pregunta estamos intentando responder?</p>
                            </div>
                            </div>

                            {/* Conector */}
                            <div className="h-6 w-0.5 bg-slate-200 ml-6"></div>

                            {/* Paso 2 */}
                            <div className="flex gap-4 items-center group">
                            <div className="flex-shrink-0 w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center border-2 border-slate-200 group-hover:border-blue-400 group-hover:bg-blue-50 transition-colors z-10">
                                <i className="fa-solid fa-database w-6 h-6 flex justify-center items-center text-slate-500 group-hover:text-blue-600 text-xl"></i>
                            </div>
                            <div className="bg-white p-3 rounded-lg border border-slate-100 shadow-sm flex-grow group-hover:shadow-md transition-shadow">
                                <h4 className="font-bold text-slate-800 text-sm">2. Datos Crudos</h4>
                                <p className="text-xs text-slate-500">Recolección de las variables correctas.</p>
                            </div>
                            </div>
                            
                            {/* Conector */}
                            <div className="h-6 w-0.5 bg-slate-200 ml-6"></div>

                            {/* Paso 3 */}
                            <div className="flex gap-4 items-center group">
                            <div className="flex-shrink-0 w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center border-2 border-slate-200 group-hover:border-purple-400 group-hover:bg-purple-50 transition-colors z-10">
                                <i className="fa-solid fa-magnifying-glass w-6 h-6 flex justify-center items-center text-slate-500 group-hover:text-purple-600 text-xl"></i>
                            </div>
                            <div className="bg-white p-3 rounded-lg border border-slate-100 shadow-sm flex-grow group-hover:shadow-md transition-shadow">
                                <h4 className="font-bold text-slate-800 text-sm">3. Exploración & Análisis</h4>
                                <p className="text-xs text-slate-500">Encontrar el "Insight" (El Hallazgo).</p>
                            </div>
                            </div>

                            {/* Conector */}
                            <div className="h-6 w-0.5 bg-slate-200 ml-6"></div>

                            {/* Paso 4 */}
                            <div className="flex gap-4 items-center group">
                            <div className="flex-shrink-0 w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center border-2 border-slate-200 group-hover:border-amber-400 group-hover:bg-amber-50 transition-colors z-10">
                                <i className="fa-solid fa-pen-nib w-6 h-6 flex justify-center items-center text-slate-500 group-hover:text-amber-600 text-xl"></i>
                            </div>
                            <div className="bg-white p-3 rounded-lg border border-slate-100 shadow-sm flex-grow group-hover:shadow-md transition-shadow">
                                <h4 className="font-bold text-slate-800 text-sm">4. Narrativa (Guion)</h4>
                                <p className="text-xs text-slate-500">Definir audiencia y contexto.</p>
                            </div>
                            </div>

                            {/* Conector */}
                            <div className="h-6 w-0.5 bg-slate-200 ml-6"></div>

                            {/* Paso 5 */}
                            <div className="flex gap-4 items-center group">
                            <div className="flex-shrink-0 w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center border-2 border-slate-200 group-hover:border-pink-400 group-hover:bg-pink-50 transition-colors z-10">
                                <i className="fa-solid fa-table-columns w-6 h-6 flex justify-center items-center text-slate-500 group-hover:text-pink-600 text-xl"></i>
                            </div>
                            <div className="bg-white p-3 rounded-lg border border-slate-100 shadow-sm flex-grow group-hover:shadow-md transition-shadow">
                                <h4 className="font-bold text-slate-800 text-sm">5. Visualización</h4>
                                <p className="text-xs text-slate-500">Diseño limpio y eficiente.</p>
                            </div>
                            </div>

                            {/* Conector */}
                            <div className="h-6 w-0.5 bg-slate-200 ml-6"></div>

                            {/* Paso 6 */}
                            <div className="flex gap-4 items-center group">
                            <div className="flex-shrink-0 w-12 h-12 rounded-full bg-green-100 flex items-center justify-center border-2 border-green-300 shadow-md z-10 animate-pulse">
                                <i className="fa-solid fa-bolt w-6 h-6 flex justify-center items-center text-green-600 text-xl"></i>
                            </div>
                            <div className="bg-green-50 p-3 rounded-lg border border-green-200 shadow-sm flex-grow">
                                <h4 className="font-bold text-green-900 text-sm">6. COMUNICACIÓN & CAMBIO</h4>
                                <p className="text-xs text-green-700">Decisiones y valor real.</p>
                            </div>
                            </div>

                        </div>
                        </div>
                    )
                }
            ];

            // Base de conocimientos y preguntas del experto
            const questions = [
                {
                    id: 1,
                    category: "Contexto & Audiencia",
                    question: "¿Quién es el destinatario principal de este dashboard o visualización?",
                    icon: "fa-users",
                    color: "text-blue-400",
                    options: [
                        { text: "Cualquiera que tenga acceso al enlace en la empresa.", points: 1, feedback: "Cuidado: Diseñar para 'todos' es diseñar para nadie. Necesitas segmentar." },
                        { text: "Mi jefe directo y el equipo técnico.", points: 2, feedback: "Mejor, pero ¿ellos tomarán la decisión final o necesitan convencer a alguien más?" },
                        { text: "Un perfil de decisión específico (ej. Director de Marketing) con una necesidad concreta.", points: 4, feedback: "¡Excelente! La especificidad es la clave de la relevancia." }
                    ]
                },
                {
                    id: 2,
                    category: "El Mensaje (The Big Idea)",
                    question: "¿Podrías resumir el mensaje principal de tus datos en una sola oración?",
                    icon: "fa-circle-info",
                    color: "text-purple-400",
                    options: [
                        { text: "No, los datos son complejos y muestran muchas cosas a la vez.", points: 1, feedback: "Alerta roja. Si tú no lo tienes claro, tu audiencia menos. Busca tu 'Idea Central'." },
                        { text: "Tengo varios hallazgos, necesitaría un párrafo o dos.", points: 2, feedback: "Vas por buen camino, pero intenta sintetizar más. Prioriza la jerarquía." },
                        { text: "Sí: 'Las ventas cayeron por X y debemos invertir en Y para recuperar Z'.", points: 4, feedback: "Perfecto. Tienes un punto de vista único y una llamada a la acción." }
                    ]
                },
                {
                    id: 3,
                    category: "Arco Narrativo",
                    question: "¿Cómo has estructurado el flujo de la información?",
                    icon: "fa-table-columns",
                    color: "text-green-400",
                    options: [
                        { text: "He puesto los gráficos más coloridos al principio.", points: 1, feedback: "La estética no es estructura. Necesitas lógica de negocio." },
                        { text: "Agrupé las métricas por fuente de datos (ej. todo lo de Google Analytics junto).", points: 2, feedback: "Funcional para analistas, pero aburrido para decisores. Intenta agrupar por temas de negocio." },
                        { text: "Sigo una estructura lógica: Contexto -> Conflicto (el problema) -> Resolución (los datos).", points: 4, feedback: "¡Brillante! Estás aplicando el 'Viaje del Héroe' a tus datos." }
                    ]
                },
                {
                    id: 4,
                    category: "Carga Cognitiva & Diseño",
                    question: "Mira tu gráfico principal. ¿Qué porcentaje de 'tinta' es dato real vs. decoración?",
                    icon: "fa-chart-column",
                    color: "text-orange-400",
                    note: "Referencia: Edward Tufte y el Data-Ink Ratio.",
                    options: [
                        { text: "Tengo fondos, bordes 3D y muchas etiquetas para que se vea completo.", points: 1, feedback: "Error común. El 'ruido visual' cansa al cerebro. Elimina lo superfluo." },
                        { text: "Es limpio, pero uso muchos colores distintos para cada barra.", points: 2, feedback: "El color debe usarse estratégicamente para destacar, no para decorar." },
                        { text: "Minimalista. Solo resalto en color el dato 'protagonista' que quiero que vean.", points: 4, feedback: "Nivel experto. Estás guiando la atención pre-atentiva del usuario." }
                    ]
                },
                {
                    id: 5,
                    category: "Interacción vs. Explicación",
                    question: "¿Qué papel juega la interactividad en tu visualización?",
                    icon: "fa-bolt",
                    color: "text-yellow-400",
                    options: [
                        { text: "Es estática (PDF/PPT) o con filtros básicos.", points: 2, feedback: "Está bien para presentaciones ejecutivas donde tú controlas la narrativa (Author-Driven)." },
                        { text: "El usuario debe explorar y descubrir sus propios 'insights' (Drill-down libre).", points: 3, feedback: "Bueno para exploración (Reader-Driven), pero asegúrate de darles un punto de partida claro." },
                        { text: "Híbrido: Empiezo con una conclusión guiada y permito profundizar en los detalles (Martini Glass).", points: 4, feedback: "La técnica de la 'Copa de Martini' es el estándar de oro en periodismo de datos." }
                    ]
                }
            ];

            const handleAnswer = (points, feedback) => {
                const newAnswers = [...answers, { questionId: questions[currentQuestion].id, points, feedback }];
                setAnswers(newAnswers);
                setScore(score + points);

                if (currentQuestion < questions.length - 1) {
                    setCurrentQuestion(currentQuestion + 1);
                } else {
                    setGameState('result');
                }
            };

            const restartQuiz = () => {
                setGameState('welcome');
                setCurrentQuestion(0);
                setCurrentLearnStep(0);
                setScore(0);
                setAnswers([]);
            };

            const goHome = () => {
                setGameState('welcome');
                setCurrentQuestion(0);
                setCurrentLearnStep(0);
                setScore(0);
                setAnswers([]);
            }

            const nextLearnStep = () => {
                if (currentLearnStep < learnSteps.length - 1) {
                    setCurrentLearnStep(currentLearnStep + 1);
                } else {
                    setGameState('quiz');
                }
            };

            const prevLearnStep = () => {
                if (currentLearnStep > 0) {
                    setCurrentLearnStep(currentLearnStep - 1);
                }
            };

            const getResult = () => {
                const maxScore = questions.length * 4;
                const percentage = (score / maxScore) * 100;

                if (percentage < 50) return {
                    title: "El Explorador de Datos",
                    desc: "Tienes los datos, pero te falta la historia. Tus reportes son probablemente descriptivos ('qué pasó') pero no diagnósticos ni prescriptivos. Tiendes a sobrecargar de información.",
                    tip: "Concéntrate en eliminar el ruido. Aplica la regla: si un gráfico no ayuda a tomar una decisión, elimínalo.",
                    resource: "Edward Tufte: The Visual Display of Quantitative Information"
                };
                if (percentage < 80) return {
                    title: "El Analista Narrador",
                    desc: "Entiendes la importancia del contexto y la audiencia. Tus visualizaciones son limpias, pero a veces les falta ese 'golpe' emocional o estratégico para cerrar el trato.",
                    tip: "Trabaja en los títulos de tus gráficos. En lugar de 'Ventas por Región', usa 'El Norte lidera el crecimiento por tercer trimestre'.",
                    resource: "Cole Nussbaumer Knaflic: Storytelling with Data"
                };
                return {
                    title: "El Maestro del Data Storytelling",
                    desc: "Dominas el arte y la ciencia. Entiendes que el dato es solo el vehículo para el cambio organizacional. Tus dashboards no solo informan, persuaden.",
                    tip: "Ahora enfócate en la 'ética de los datos'. Asegúrate de que tu narrativa, aunque persuasiva, nunca distorsione la realidad.",
                    resource: "Alberto Cairo: The Truthful Art"
                };
            };

            // --- COMPONENTES VISUALES ---

            const Header = () => (
                <div className="w-full flex justify-between items-center px-4 py-4 md:px-8 mb-4 md:mb-8 bg-slate-200 border-b border-slate-300">
                    <div className="flex items-center gap-2 text-slate-800">
                        <span className="font-bold text-lg md:text-xl text-slate-900 tracking-tight">Pedro D. Alcalá R.</span>
                    </div>
                    <div className="flex items-center gap-4">
                        {/* Enlace al home del quiz */}
                        <button 
                            onClick={goHome}
                            className="text-blue-600 hover:text-blue-800 font-medium text-sm md:text-base transition-colors"
                        >
                            Ir al Test de Diagnóstico
                        </button>
                        {/* Botón Brochure */}
                        <a 
                            href="https://pealcala.github.io/brochure/"
                            target="_blank"
                            rel="noopener noreferrer"
                            className="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg text-sm md:text-base transition-colors shadow-sm"
                        >
                            Ver Brochure
                        </a>
                    </div>
                </div>
            );

            const Footer = () => (
                <footer className="mt-12 py-10 bg-slate-900 text-center text-slate-300">
                    <p className="text-sm mb-4">© 2025 <strong className="text-white">Pedro D. Alcalá R.</strong> Todos los derechos reservados.</p>
                    <div className="flex justify-center gap-6">
                        <a 
                            href="https://www.linkedin.com/in/pedro-daniel-alcala-rojas/" 
                            target="_blank" 
                            rel="noopener noreferrer"
                            className="flex items-center gap-2 text-slate-400 hover:text-white transition-colors font-medium text-sm"
                        >
                            <i className="fa-brands fa-linkedin text-lg"></i> LinkedIn
                        </a>
                        <a 
                            href="https://www.udemy.com/user/pedro-alcala-2/" 
                            target="_blank" 
                            rel="noopener noreferrer"
                            className="flex items-center gap-2 text-slate-400 hover:text-white transition-colors font-medium text-sm"
                        >
                            <i className="fa-solid fa-graduation-cap text-lg"></i> Udemy
                        </a>
                    </div>
                </footer>
            );

            const WelcomeScreen = () => (
                <div className="flex flex-col items-center justify-center text-center space-y-8 animate-fade-in flex-grow">
                    <div className="bg-gradient-to-br from-blue-600 to-indigo-700 p-6 rounded-full shadow-2xl mb-4">
                        <i className="fa-solid fa-book-open text-white text-4xl"></i>
                    </div>
                    <h1 className="text-4xl md:text-5xl font-extrabold text-slate-800 tracking-tight">
                        Data Storytelling <span className="text-blue-600">Compass</span>
                    </h1>
                    <p className="text-lg text-slate-600 max-w-2xl leading-relaxed">
                        Como consultor, he visto demasiados dashboards que mueren en el olvido. 
                        Este diagnóstico interactivo evaluará si estás construyendo un simple reporte o una 
                        <span className="font-semibold text-blue-600"> narrativa de datos coherente</span>.
                    </p>
                    
                    <div className="flex flex-col sm:flex-row gap-4">
                        <button 
                            onClick={() => setGameState('learn')}
                            className="group relative px-8 py-4 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:shadow-2xl hover:bg-blue-700 transition-all transform hover:-translate-y-1"
                        >
                            <span className="flex items-center gap-2">
                                <i className="fa-solid fa-lightbulb"></i> Aprender Teoría (Recomendado)
                            </span>
                        </button>
                        <button 
                            onClick={() => setGameState('quiz')}
                            className="px-8 py-4 bg-white text-slate-700 font-bold rounded-xl shadow border border-slate-200 hover:bg-slate-50 transition-colors"
                        >
                            Ir directo al Diagnóstico
                        </button>
                    </div>
                    
                    <div className="mt-8 text-sm text-slate-400">
                        Basado en principios de Gestalt, Tufte y Psicología Cognitiva.
                    </div>
                </div>
            );

            const LearnScreen = () => {
                const step = learnSteps[currentLearnStep];
                return (
                    <div className="w-full max-w-3xl mx-auto animate-fade-in flex-grow">
                        {/* Progress Dots */}
                        <div className="flex justify-center gap-2 mb-8">
                            {learnSteps.map((_, idx) => (
                                <div 
                                    key={idx} 
                                    className={`w-3 h-3 rounded-full transition-all ${idx === currentLearnStep ? 'bg-blue-600 w-8' : 'bg-slate-300'}`}
                                />
                            ))}
                        </div>

                        <div className="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden flex flex-col min-h-[500px]">
                            <div className="bg-slate-50 p-6 border-b border-slate-100 flex items-center gap-4">
                                <div className="bg-white p-3 rounded-full shadow-sm">
                                    <i className={`fa-solid ${step.icon} ${step.color} text-2xl`}></i>
                                </div>
                                <h2 className="text-xl md:text-2xl font-bold text-slate-800">{step.title}</h2>
                            </div>
                            
                            <div className="p-8 flex-grow flex flex-col justify-center">
                                {step.content}
                                
                                {/* Referencias Externas */}
                                {step.links && (
                                    <div className="mt-8 pt-6 border-t border-slate-100">
                                        <h5 className="text-xs font-bold text-slate-400 uppercase mb-3 flex items-center gap-2">
                                            <i className="fa-solid fa-arrow-up-right-from-square text-xs"></i> Referencias y Lecturas
                                        </h5>
                                        <div className="flex flex-wrap gap-3">
                                            {step.links.map((link, idx) => (
                                                <a 
                                                    key={idx} 
                                                    href={link.url} 
                                                    target="_blank" 
                                                    rel="noopener noreferrer"
                                                    className="text-xs bg-slate-100 hover:bg-blue-50 text-slate-600 hover:text-blue-600 px-3 py-1.5 rounded-full transition-colors flex items-center gap-1 border border-slate-200"
                                                >
                                                    {link.label} <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                                </a>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="bg-slate-50 p-6 border-t border-slate-100 flex justify-between items-center">
                                <button 
                                    onClick={prevLearnStep}
                                    disabled={currentLearnStep === 0}
                                    className={`flex items-center gap-2 text-slate-600 font-bold hover:text-blue-600 transition-colors ${currentLearnStep === 0 ? 'opacity-0 pointer-events-none' : ''}`}
                                >
                                    <i className="fa-solid fa-arrow-left"></i> Anterior
                                </button>
                                
                                <button 
                                    onClick={nextLearnStep}
                                    className="flex items-center gap-2 bg-slate-900 text-white px-6 py-3 rounded-xl font-bold hover:bg-slate-800 transition-all shadow-lg hover:shadow-xl"
                                >
                                    {currentLearnStep === learnSteps.length - 1 ? (
                                        <>Iniciar Diagnóstico <i className="fa-solid fa-bolt text-yellow-400"></i></>
                                    ) : (
                                        <>Siguiente <i className="fa-solid fa-arrow-right"></i></>
                                    )}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            const QuizScreen = () => {
                const q = questions[currentQuestion];
                return (
                    <div className="w-full max-w-3xl mx-auto flex-grow">
                        {/* Progress Bar */}
                        <div className="w-full bg-slate-200 h-2 rounded-full mb-8 overflow-hidden">
                            <div 
                                className="bg-blue-600 h-full transition-all duration-500 ease-out"
                                style={{ width: `${((currentQuestion) / questions.length) * 100}%` }}
                            ></div>
                        </div>

                        {/* Header Question */}
                        <div className="bg-white rounded-2xl shadow-xl border border-slate-100 p-8 mb-6 relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-4 opacity-10">
                                <i className={`fa-solid ${q.icon} ${q.color} text-4xl`}></i>
                            </div>
                            <div className="flex items-center gap-3 mb-4">
                                <span className="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                                    Fase {currentQuestion + 1}: {q.category}
                                </span>
                            </div>
                            <h2 className="text-2xl font-bold text-slate-800 mb-2">{q.question}</h2>
                            {q.note && (
                                <p className="text-sm text-slate-500 italic flex items-center gap-2 mt-2">
                                    <i className="fa-solid fa-circle-info"></i> {q.note}
                                </p>
                            )}
                        </div>

                        {/* Options */}
                        <div className="grid gap-4">
                            {q.options.map((opt, idx) => (
                                <button
                                    key={idx}
                                    onClick={() => handleAnswer(opt.points, opt.feedback)}
                                    className="text-left bg-white hover:bg-blue-50 border-2 border-slate-100 hover:border-blue-300 p-6 rounded-xl transition-all duration-200 group shadow-sm hover:shadow-md"
                                >
                                    <div className="flex items-start gap-4">
                                        <div className="mt-1 w-6 h-6 rounded-full border-2 border-slate-300 group-hover:border-blue-500 flex-shrink-0 flex items-center justify-center">
                                            <div className="w-2.5 h-2.5 rounded-full bg-blue-500 opacity-0 group-hover:opacity-100 transition-opacity" />
                                        </div>
                                        <p className="text-slate-700 font-medium text-lg">{opt.text}</p>
                                    </div>
                                </button>
                            ))}
                        </div>
                    </div>
                );
            };

            const ResultScreen = () => {
                const result = getResult();
                
                return (
                    <div className="max-w-4xl mx-auto animate-fade-in flex-grow">
                        <div className="bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
                            <div className="bg-slate-900 text-white p-10 text-center relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-full opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-blue-400 via-slate-900 to-slate-900"></div>
                                <h2 className="text-blue-300 font-semibold tracking-widest uppercase mb-2">Diagnóstico Final</h2>
                                <h1 className="text-4xl md:text-5xl font-bold mb-4">{result.title}</h1>
                                <div className="inline-block bg-white/10 backdrop-blur-md px-6 py-2 rounded-full border border-white/20">
                                    Puntuación: {score} / {questions.length * 4}
                                </div>
                            </div>

                            <div className="p-8 md:p-12">
                                <div className="mb-10">
                                    <h3 className="text-xl font-bold text-slate-800 mb-3 flex items-center gap-2">
                                        <i className="fa-solid fa-bullseye text-blue-600"></i> Análisis del Perfil
                                    </h3>
                                    <p className="text-slate-600 leading-relaxed text-lg">{result.desc}</p>
                                </div>

                                <div className="grid md:grid-cols-2 gap-8 mb-10">
                                    <div className="bg-amber-50 p-6 rounded-2xl border border-amber-100">
                                        <h4 className="font-bold text-amber-800 mb-2 flex items-center gap-2">
                                            <i className="fa-solid fa-bolt"></i> Acción Recomendada
                                        </h4>
                                        <p className="text-amber-700">{result.tip}</p>
                                    </div>
                                    <div className="bg-blue-50 p-6 rounded-2xl border border-blue-100">
                                        <h4 className="font-bold text-blue-800 mb-2 flex items-center gap-2">
                                            <i className="fa-solid fa-book-open"></i> Recurso Clave
                                        </h4>
                                        <p className="text-blue-700 font-medium">{result.resource}</p>
                                    </div>
                                </div>

                                {/* Breakdown of answers */}
                                <div className="border-t border-slate-200 pt-8">
                                    <h3 className="text-lg font-bold text-slate-800 mb-6">Detalle de tu Retroalimentación</h3>
                                    <div className="space-y-4">
                                        {answers.map((ans, idx) => (
                                            <div key={idx} className="flex gap-4 p-4 bg-slate-50 rounded-lg">
                                                <div className="flex-shrink-0 mt-1">
                                                    <i className="fa-solid fa-circle-check text-green-500"></i>
                                                </div>
                                                <div>
                                                    <p className="text-xs font-bold text-slate-400 uppercase mb-1">
                                                        {questions.find(q => q.id === ans.questionId)?.category}
                                                    </p>
                                                    <p className="text-slate-700">{ans.feedback}</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="mt-12 text-center">
                                    <button 
                                        onClick={restartQuiz}
                                        className="inline-flex items-center gap-2 px-6 py-3 bg-slate-200 text-slate-700 font-bold rounded-lg hover:bg-slate-300 transition-colors"
                                    >
                                        <i className="fa-solid fa-rotate"></i> Volver al Inicio
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-900 selection:bg-blue-100 flex flex-col">
                    <Header />
                    <main className="w-full max-w-5xl mx-auto px-4 md:px-6 flex-grow flex flex-col">
                        {gameState === 'welcome' && <WelcomeScreen />}
                        {gameState === 'learn' && <LearnScreen />}
                        {gameState === 'quiz' && <QuizScreen />}
                        {gameState === 'result' && <ResultScreen />}
                    </main>
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DataStorytellingApp />);
    </script>
</body>
</html>
